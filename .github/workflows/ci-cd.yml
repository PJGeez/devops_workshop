name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: 4. Run Automated Unit Tests
        run: npm test

      - name: 5. Deploy to Local Staging Port (3001)
        run: |
          chmod +x ./scripts/deploy-staging.sh
          ./scripts/deploy-staging.sh

      - name: 6. Health Check Staging Endpoint
        run: |
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh 3001

      - name: 7. Promote & Deploy to Production Port (3000)
        run: |
          chmod +x ./scripts/deploy-prod.sh
          ./scripts/deploy-prod.sh

      - name: 8. Final Production Health Check
        run: |
          ./scripts/health-check.sh 3000
